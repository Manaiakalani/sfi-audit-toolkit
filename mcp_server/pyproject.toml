[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sfi-audit"
version = "1.0.0"
description = "Microsoft Secure Future Initiative (SFI) audit knowledge base and MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# mcp 2.x removed `mcp.server.fastmcp` (imported by server.py) and requires
# Python >=3.10; stay on the 1.x line. The >=1.28.1 floor clears advisories
# fixed in 1.28.1.
dependencies = ["mcp[cli]>=1.28.1,<3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sfi-audit-mcp = "sfi_audit.server:main"

[tool.setuptools]
packages = ["sfi_audit", "sfi_audit.checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
